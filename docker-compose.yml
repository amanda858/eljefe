version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: eljefe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eljefe"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: node:22
    working_dir: /app/backend
    command: sh -lc "npm install && npm run dev:boot"
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eljefe?schema=public
    volumes:
      - ./:/app
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    command: sh -lc "npm install && npm run dev"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_BASE_URL: http://backend:4000
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data: